[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[deepgram,groq,runner,silero,webrtc,websocket]>=1.11,<2",
    "tzdata",  # timezone database (Windows has none built in)
    "python-docx",  # reads the client's intake .docx
    "google-api-python-client",  # Google Calendar booking
    "google-auth-oauthlib",  # one-time calendar authorisation
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]